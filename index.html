<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock, Paper, Scissors</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 600px;
        background-color: lightgray;
        margin: auto;
        text-align: center;
        height: 200px;
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: center;
      }
      button {
        padding: 15px;
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
      <div id="results">
        <p id="paraComputerScore"></p>
        <p id="paraHumanScore"></p>
        <p id="paraTie"></p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
